<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kinopub Helper</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 12px; min-width: 300px; }
      .muted { color: #666; font-size: 12px; }
      .row { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
      button { padding: 8px 10px; cursor: pointer; }
      code { background: #f3f3f3; padding: 2px 4px; border-radius: 4px; }
      .mods { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
      .mod { font-size: 12px; color: #333; }
    </style>
</head>
<body>
<div><b>Kinopub Helper</b></div>
<div class="muted">Модули берутся из registry автоматически.</div>

<div id="state" class="row"></div>
<div id="mods" class="mods"></div>

<div class="row">
    <button id="openSettings">Настройки</button>
</div>

<script type="module" src="popup.js"></script>
</body>
</html>
