<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kinopub Helper — Настройки</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 16px; }
      .row { margin: 12px 0; }
      label { display: block; margin-bottom: 6px; font-weight: 600; }
      input[type="text"] { width: 420px; max-width: 100%; padding: 8px 10px; }
      button { padding: 8px 12px; cursor: pointer; }
      .hint { color: #666; font-size: 13px; margin-top: 6px; }
      .status { margin-top: 10px; font-size: 13px; white-space: pre-wrap; }
      .ok { color: #0a7a0a; }
      .bad { color: #b00020; }
      .inline { display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; }

      .mods { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
      .mod { padding: 10px 12px; border: 1px solid #e5e5e5; border-radius: 10px; }
      .modTop { display: flex; gap: 10px; align-items: flex-start; }
      .modTitle { font-weight: 700; }
      .modDesc { color: #666; font-size: 13px; margin-top: 4px; }
    </style>
</head>
<body>
<h2>Kinopub Helper — Настройки</h2>

<div class="row">
    <label>
        <input id="enabled" type="checkbox" />
        Включено
    </label>
</div>

<div class="row">
    <label for="host">Хост KinoPub (по умолчанию: kino.pub)</label>
    <div class="inline">
        <input id="host" type="text" placeholder="kino.pub" />
        <button id="save">Сохранить</button>
        <button id="grant">Выдать доступ к хосту</button>
    </div>
    <div class="hint">
        Если используешь зеркало — введи его адрес и нажми «Выдать доступ к хосту».
    </div>
    <div id="permState" class="hint"></div>
    <div id="status" class="status"></div>
</div>

<div class="row">
    <h3>Модули</h3>
    <div id="modules" class="mods"></div>
    <div class="hint">Каждый модуль можно отключить отдельно.</div>
</div>

<script type="module" src="settings.js"></script>
</body>
</html>
